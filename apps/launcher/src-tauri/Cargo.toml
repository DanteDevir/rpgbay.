[package]
name = "rpgbay-launcher"
version = "1.0.0"
edition = "2021"

[lib]
name = "rpgbay_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
aes-gcm = "=0.10.3"
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls", "json"] }
url = "=2.5.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
