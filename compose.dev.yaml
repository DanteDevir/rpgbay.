name: rpgbay-dev
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: rpgbay
      POSTGRES_USER: rpgbay
      POSTGRES_PASSWORD: rpgbay_local_only
    ports: ["127.0.0.1:5432:5432"]
    volumes: [dev_database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rpgbay -d rpgbay"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dev_database:
